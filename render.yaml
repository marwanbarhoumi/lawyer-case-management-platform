# Reference for the zero-cost demo: ONE free web service only (no Render database, no cron job).
# Create the service manually in the dashboard (docs/deployment.md §4); this file lists the same settings.
#   Database:   Neon Free PostgreSQL (DATABASE_URL)
#   Reminders:  GitHub Actions schedule (.github/workflows/reminders.yml)
#   Frontend:   Vercel Hobby, proxying /api to this service (API_PROXY_TARGET)
# See docs/deployment.md. Never change `plan` without checking the price.
services:
  - type: web
    name: lexora-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false # Neon direct connection string, without channel_binding
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # https://<project>.vercel.app
      - key: CORS_ORIGIN
        sync: false # same value as APP_URL
      - key: APP_TIMEZONE
        value: Africa/Tunis
      - key: ALLOW_REGISTRATION
        value: 'false'
      # Free instances have no persistent disk: documents go to S3-compatible storage.
      - key: UPLOAD_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false # Backblaze B2: region of the endpoint (e.g. eu-central-003); Cloudflare R2: auto
      - key: S3_ENDPOINT
        sync: false
      - key: UPLOAD_API_KEY
        sync: false
      - key: UPLOAD_API_SECRET
        sync: false
      - key: MAX_UPLOAD_MB
        value: '10'
      # Free instances sleep after 15 idle minutes: reminders run from GitHub Actions instead.
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: 'false'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
